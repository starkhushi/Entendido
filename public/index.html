<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospect Brief Writer</title>
<style>
  :root { --bg:#f7f6f2; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e1da; --accent:#1f5f5b; --accent-ink:#ffffff; --err:#a3312a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --muted:#a09f98; --line:#33322f; --accent:#5fb3ab; --accent-ink:#0e1a19; --err:#ef8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .lede { color:var(--muted); margin:0 0 24px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:grid; gap:14px; }
  label { font-weight:600; font-size:.9rem; display:grid; gap:6px; }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); width:100%; }
  button { font:inherit; font-weight:600; padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); cursor:pointer; justify-self:start; }
  button[disabled] { opacity:.6; cursor:wait; }
  .ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #status { margin:20px 0 0; color:var(--muted); min-height:1.5em; }
  #status.err { color:var(--err); }
  #result { display:none; margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 24px 24px; }
  #result table { border-collapse:collapse; width:100%; font-size:.92rem; display:block; overflow-x:auto; }
  #result th, #result td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  #result a { color:var(--accent); word-break:break-word; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Prospect brief writer</h1>
  <p class="lede">Type a company. The agent searches the web, reads about 30 pages and writes a one-page brief in the Emcure/Gennova format. It takes one to three minutes.</p>
  <form id="f">
    <label>Company <input id="company" required placeholder="e.g. Emcure Pharmaceuticals"></label>
    <label>Focus (optional) <input id="focus" placeholder="e.g. the Gennova subsidiary"></label>
    <label>Team password <input id="password" type="password" autocomplete="current-password"></label>
    <button id="go">Write brief</button>
  </form>
  <p id="status"></p>
  <div id="result">
    <div class="bar"><button class="ghost" id="dl" type="button">Download brief (.md)</button><button class="ghost" id="cp" type="button">Copy text</button></div>
    <article id="brief"></article>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
try { $("password").value = localStorage.getItem("pw") || ""; } catch (e) {}
let last = null;
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = $("go"), status = $("status");
  go.disabled = true; status.className = ""; $("result").style.display = "none";
  const t0 = Date.now();
  const tick = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    const step = s < 10 ? "Planning searches" : s < 35 ? "Searching Google" : s < 60 ? "Reading pages" : "Writing the brief";
    status.textContent = `${step}... ${s}s`;
  }, 1000);
  try {
    const r = await fetch("/api/brief", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ company: $("company").value, focus: $("focus").value, password: $("password").value }) });
    const data = await r.json().catch(() => ({ error: r.status === 504 ? "The run took longer than 5 minutes. Try again." : `Server error ${r.status}.` }));
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
    try { localStorage.setItem("pw", $("password").value); } catch (e) {}
    last = data;
    $("brief").innerHTML = DOMPurify.sanitize(marked.parse(data.brief));
    $("brief").querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    $("result").style.display = "block";
    status.textContent = `Done in ${Math.round((Date.now() - t0) / 1000)}s from ${data.sources.length} sources.`;
  } catch (e) {
    status.className = "err"; status.textContent = e.message;
  } finally { clearInterval(tick); go.disabled = false; }
});
$("dl").onclick = () => {
  const slug = last.company.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([last.brief], { type: "text/markdown" }));
  a.download = `${slug}.md`; a.click();
};
$("cp").onclick = async () => { await navigator.clipboard.writeText(last.brief); $("cp").textContent = "Copied"; setTimeout(() => $("cp").textContent = "Copy text", 1500); };
</script>
</body>
</html>
